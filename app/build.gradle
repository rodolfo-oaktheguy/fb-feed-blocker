plugins { id 'com.android.application' }
android {
    namespace 'com.feedblocker'
    compileSdk 34
    signingConfigs {
        // One fixed key, so every GitHub build can install over the previous one
        fixed {
            storeFile file('feedblocker.keystore')
            storePassword 'feedblocker'
            keyAlias 'feedblocker'
            keyPassword 'feedblocker'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
    }
    defaultConfig {
        applicationId 'com.feedblocker'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '1.6'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
